[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reading-plan-mtp"
version = "1.0.0"
description = "Книжный план, лабораторная работа №8 по МТП"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
reading-plan = "reading_plan.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
